<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GreenCare Network | Administrator Login</title>
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#edf6ed;font-family:Arial,sans-serif;color:#153b28}.panel{width:min(440px,calc(100% - 32px));background:white;border-radius:20px;padding:36px;box-shadow:0 16px 48px #006c3720}.brand{color:#006c37;font-size:29px;font-weight:800}.brand span{color:#91d43c}h1{font-size:21px;margin:22px 0 8px}p{line-height:1.5;color:#51675a}label{display:block;font-weight:bold;margin-top:22px}input,button{width:100%;font-size:16px;padding:14px;margin-top:10px;border-radius:9px}input{border:1px solid #abc7b1}button{border:0;background:#006c37;color:white;cursor:pointer}button:disabled{opacity:.65}#signed{display:none}#message{min-height:22px}small{color:#62786a}</style></head>
<body><main class="panel"><div class="brand">Green<span>Care</span> +</div><h1>Network administrator login</h1><p>Sign in securely with your registered email address.</p><section id="login"><label for="email">Email address</label><input id="email" type="email" value="luckyndala743@gmail.com" autocomplete="email"><button id="send">Email me a sign-in link</button><p><small>Only existing accounts can request a link. Administrator permissions are assigned separately.</small></p></section><section id="signed"><h1>Signed in successfully</h1><p id="who"></p><p>Your account is authenticated. The administrator dashboard is not yet connected.</p><button id="out">Sign out</button></section><p id="message" role="status"></p></main>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const supabase=createClient('https://coyholljvovxminxortk.supabase.co','sb_publishable_3linxviDsVfrEik-qSuQ5A_WuaCC0x6',{auth:{persistSession:true,detectSessionInUrl:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id),message=$('message');
async function refresh(){const {data:{user},error}=await supabase.auth.getUser();if(user){$('login').style.display='none';$('signed').style.display='block';$('who').textContent=user.email||'Account verified';}else if(error && location.hash)message.textContent='Sign-in failed: '+error.message;}
$('send').onclick=async()=>{const email=$('email').value.trim();if(!email){message.textContent='Please enter an email address.';return;}const btn=$('send');btn.disabled=true;message.textContent='Sending sign-in link…';try{const {error}=await supabase.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});message.textContent=error?'Could not send: '+error.message:'Check your email and click the new sign-in link.';}catch(e){message.textContent='Connection error: '+e.message;}finally{btn.disabled=false;}};
$('out').onclick=async()=>{await supabase.auth.signOut();location.assign(location.pathname);};
await refresh();
</script></body></html>
