<!doctype html><html><head><meta charset="utf-8"><title>GreenCare Applications</title><style>body{font:16px Arial;background:#edf6ed;color:#173b29;margin:40px auto;max-width:960px;padding:20px}h1{color:#006c37}table{background:white;border-collapse:collapse;width:100%}td,th{padding:12px;border:1px solid #d8e8dc;text-align:left}button{padding:12px;background:#006c37;color:white;border:0}</style></head><body><h1>GreenCare Network — Applications</h1><p><a href="/">Back to login</a></p><p id="status">Checking access…</p><button id="refresh">Refresh</button><table><thead><tr><th>Organisation</th><th>Type</th><th>Status</th><th>Submitted</th></tr></thead><tbody id="rows"></tbody></table><p>Read-only view. Pharmacy approvals require licensing verification.</p><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const s=createClient('https://coyholljvovxminxortk.supabase.co','sb_publishable_3linxviDsVfrEik-qSuQ5A_WuaCC0x6');
const status=document.getElementById('status'),rows=document.getElementById('rows');
async function load(){rows.replaceChildren();const {data:{user}}=await s.auth.getUser();if(!user){status.textContent='Please sign in first.';return}const {data:roles,error:e}=await s.from('organization_memberships').select('role,status').eq('user_id',user.id).eq('role','network_admin').eq('status','active').limit(1);if(e||!roles?.length){status.textContent='Administrator access unavailable.';return}const {data,error}=await s.from('membership_applications').select('organization_name,applicant_kind,status,submitted_at').order('submitted_at',{ascending:false}).limit(100);if(error){status.textContent=error.message;return}status.textContent='Administrator verified. '+data.length+' applications found.';for(const a of data){const tr=document.createElement('tr');for(const v of [a.organization_name||'Individual',a.applicant_kind,a.status,a.submitted_at?new Date(a.submitted_at).toLocaleDateString('en-ZA'):'—']){const td=document.createElement('td');td.textContent=v;tr.appendChild(td)}rows.appendChild(tr)}}
document.getElementById('refresh').onclick=load;load();</script></body></html>
