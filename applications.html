<!doctype html><html><head><meta charset="utf-8"><title>GreenCare Applications</title><style>body{font:16px Arial;background:#edf6ed;color:#173b29;margin:40px auto;max-width:960px;padding:20px}h1{color:#006c37}table{background:white;border-collapse:collapse;width:100%}td,th{padding:12px;border:1px solid #d8e8dc;text-align:left}button{padding:12px;background:#006c37;color:white;border:0}input{padding:12px;border:1px solid #9fbfa7;border-radius:5px;max-width:100%}#signin{background:white;padding:20px;border-radius:10px;margin:20px 0}</style></head><body><h1>GreenCare Network — Applications</h1><p><a href="/">Back to login</a></p><p id="status">Checking access…</p><section id="signin" hidden><p>Sign in with your existing GreenCare administrator email. We will send a secure link back to this page.</p><label for="email">Email address</label> <input id="email" type="email" autocomplete="email" placeholder="Your registered email"> <button id="send">Email me a sign-in link</button><p id="loginmessage" role="status"></p></section><button id="refresh">Refresh</button><table><thead><tr><th>Organisation</th><th>Type</th><th>Status</th><th>Submitted</th></tr></thead><tbody id="rows"></tbody></table><p>Read-only view. Pharmacy approvals require licensing verification.</p><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const s=createClient('https://coyholljvovxminxortk.supabase.co','sb_publishable_3linxviDsVfrEik-qSuQ5A_WuaCC0x6');
const status=document.getElementById('status'),rows=document.getElementById('rows');
async function load(){rows.replaceChildren();const {data:{user}}=await s.auth.getUser();if(!user){status.textContent='Sign in to view applications.';document.getElementById('signin').hidden=false;return}document.getElementById('signin').hidden=true;const {data:roles,error:e}=await s.from('organization_memberships').select('role,status').eq('user_id',user.id).eq('role','network_admin').eq('status','active').limit(1);if(e||!roles?.length){status.textContent='Administrator access unavailable.';return}const {data,error}=await s.from('membership_applications').select('organization_name,applicant_kind,status,submitted_at').order('submitted_at',{ascending:false}).limit(100);if(error){status.textContent=error.message;return}status.textContent='Administrator verified. '+data.length+' applications found.';for(const a of data){const tr=document.createElement('tr');for(const v of [a.organization_name||'Individual',a.applicant_kind,a.status,a.submitted_at?new Date(a.submitted_at).toLocaleDateString('en-ZA'):'—']){const td=document.createElement('td');td.textContent=v;tr.appendChild(td)}rows.appendChild(tr)}}
document.getElementById('send').onclick=async()=>{const email=document.getElementById('email').value.trim();const msg=document.getElementById('loginmessage');if(!email){msg.textContent='Enter your registered email address.';return}const btn=document.getElementById('send');btn.disabled=true;msg.textContent='Sending sign-in link…';try{const {error}=await s.auth.signInWithOtp({email,options:{shouldCreateUser:false,emailRedirectTo:location.origin+location.pathname}});msg.textContent=error?'Unable to send: '+error.message:'Check your email and click the sign-in link.'}catch(e){msg.textContent='Connection error: '+e.message}finally{btn.disabled=false}};document.getElementById('refresh').onclick=load;s.auth.onAuthStateChange(()=>{setTimeout(load,0)});load();</script></body></html>
